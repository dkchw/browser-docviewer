[project]
name = "docviewer"
version = "1.7.0"
description = "A universal local web server for reading PDFs, EPUBs, and DOCX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mammoth>=1.7.0",
    "python-multipart>=0.0.9",
    "markdown>=3.5.0"
]

[project.scripts]
docviewer = "docviewer.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
